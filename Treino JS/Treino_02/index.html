<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="calculadora">
        
        <input type="text" id="visor" value="0" readonly>
        <div class="botoes">

            <button id="btn-limpar" class="limpar">C</button>
            <button id="btn-apagar">⌫</button>
            <button id="btn-dividir" class="operador">÷</button>
            <button id="btn-multiplicar" class="operador">×</button>

            <button id="btn-7" class="numero">7</button>
            <button id="btn-8" class="numero">8</button>
            <button id="btn-9" class="numero">9</button>
            <button id="btn-subtrair" class="operador">−</button>

            <button id="btn-4" class="numero">4</button>
            <button id="btn-5" class="numero">5</button>
            <button id="btn-6" class="numero">6</button>
            <button id="btn-somar" class="operador">+</button>

            <button id="btn-1" class="numero">1</button>
            <button id="btn-2" class="numero">2</button>
            <button id="btn-3" class="numero">3</button>
            <button id="btn-igual" class="igual">=</button>

            <button id="btn-0" class="numero zero">0</button>
            <button id="btn-ponto" class="numero">.</button>
        </div>
    </main>

    <script src="main.js"></script>
</body>
</html>
